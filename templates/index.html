<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Registration Assistant</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navy: #071a3a;
            --blue: #1264e8;
            --blue-dark: #0847b8;
            --blue-light: #eaf3ff;
            --white: #ffffff;
            --text: #10213d;
            --muted: #71809a;
            --border: #dce7f5;
        }

        body {
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;

            background:
                radial-gradient(circle at 10% 10%,
                    rgba(18, 100, 232, 0.22),
                    transparent 30%),
                radial-gradient(circle at 90% 90%,
                    rgba(8, 71, 184, 0.16),
                    transparent 32%),
                #edf4fc;
        }

        .chat-container {
            width: 900px;
            max-width: 100%;

            height: 720px;
            max-height: 94vh;

            background: var(--white);

            border-radius: 26px;

            overflow: hidden;

            display: flex;
            flex-direction: column;

            border: 1px solid rgba(18, 100, 232, 0.12);

            box-shadow:
                0 30px 80px rgba(7, 26, 58, 0.18);
        }

        .header {
            padding: 25px 30px;

            display: flex;
            align-items: center;

            gap: 16px;

            color: white;

            background:
                linear-gradient(135deg,
                    #071a3a,
                    #0c4fc4 55%,
                    #1674f5);
        }

        .brand {
            width: 52px;
            height: 52px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 15px;

            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.25);

            font-family: "Space Grotesk", sans-serif;

            font-size: 16px;

            font-weight: 700;

            letter-spacing: 1px;
        }

        .header-content {
            flex: 1;
        }

        .header h1 {
            font-family: "Space Grotesk", sans-serif;

            font-size: 25px;

            font-weight: 700;

            letter-spacing: -0.5px;
        }

        .header p {
            margin-top: 5px;

            font-size: 12px;

            letter-spacing: 1.2px;

            text-transform: uppercase;

            opacity: 0.82;
        }

        .status {
            font-size: 12px;

            font-weight: 600;

            padding: 8px 13px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        #messages {
            flex: 1;

            overflow-y: auto;

            padding: 30px;

            background:
                linear-gradient(180deg,
                    #fbfdff,
                    #f2f7fd);
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: #c7d7ed;

            border-radius: 10px;
        }

        .message-wrapper {
            display: flex;

            flex-direction: column;

            margin-bottom: 22px;

            max-width: 75%;
        }

        .message-wrapper.bot {
            align-items: flex-start;
        }

        .message-wrapper.user {
            margin-left: auto;

            align-items: flex-end;
        }

        .message {
            padding: 15px 18px;

            border-radius: 18px;

            font-size: 14px;

            line-height: 1.6;

            white-space: pre-wrap;

            animation: messageAppear 0.25s ease;
        }

        .bot .message {
            color: var(--text);

            background: white;

            border: 1px solid var(--border);

            border-top-left-radius: 5px;

            box-shadow:
                0 6px 20px rgba(16, 33, 61, 0.06);
        }

        .user .message {
            color: white;

            background:
                linear-gradient(135deg,
                    var(--blue),
                    var(--blue-dark));

            border-top-right-radius: 5px;

            box-shadow:
                0 8px 22px rgba(18, 100, 232, 0.22);
        }

        .message-label {
            margin-top: 6px;

            padding: 0 5px;

            font-size: 10px;

            color: var(--muted);

            letter-spacing: 0.5px;
        }

        .input-area {
            display: flex;

            gap: 12px;

            padding: 17px 20px;

            background: white;

            border-top: 1px solid var(--border);
        }

        #message {
            flex: 1;

            min-width: 0;

            padding: 14px 16px;

            border: 1.5px solid #cfdbeb;

            border-radius: 14px;

            outline: none;

            color: var(--text);

            background: #fbfdff;

            font-family: "DM Sans", sans-serif;

            font-size: 14px;

            transition: 0.2s;
        }

        #message::placeholder {
            color: #8795aa;
        }

        #message:focus {
            border-color: var(--blue);

            box-shadow:
                0 0 0 4px rgba(18, 100, 232, 0.09);
        }

        button {
            min-width: 100px;

            padding: 0 20px;

            border: none;

            border-radius: 14px;

            color: white;

            background:
                linear-gradient(135deg,
                    var(--blue),
                    var(--blue-dark));

            font-family: "Space Grotesk", sans-serif;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 8px 20px rgba(18, 100, 232, 0.20);
        }

        button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 11px 25px rgba(18, 100, 232, 0.28);
        }

        button:active {
            transform: translateY(0);
        }

        .hint {
            text-align: center;

            padding: 0 15px 14px;

            color: #8492a8;

            font-size: 10px;
        }

        @keyframes messageAppear {

            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @media (max-width: 700px) {

            body {
                padding: 0;
            }

            .chat-container {
                height: 100vh;

                max-height: none;

                border-radius: 0;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .header p {
                font-size: 9px;
            }

            .status {
                display: none;
            }

            #messages {
                padding: 20px 15px;
            }

            .message-wrapper {
                max-width: 88%;
            }

            .input-area {
                padding: 12px;
            }

            button {
                min-width: 80px;

                padding: 0 14px;
            }

        }
    </style>

</head>


<body>

    <div class="chat-container">

        <div class="header">

            <div class="brand">
                AI
            </div>

            <div class="header-content">

                <h1>
                    AI Registration Assistant
                </h1>

                <p>
                    NLP Powered Internship Registration
                </p>

            </div>

            <div class="status">
                Online
            </div>

        </div>


        <div id="messages">

            <div class="message-wrapper bot">

                <div class="message">

                    Welcome to the AI Registration Assistant.

                    I can help you complete your internship registration.

                    Type Hello, Hi, or Namaste to begin.

                </div>

                <div class="message-label">
                    AI Assistant
                </div>

            </div>

        </div>


        <div class="input-area">

            <input id="message" type="text" placeholder="Enter your message..." autocomplete="off"
                onkeydown="handleKey(event)">

            <button onclick="sendMessage()">
                Send
            </button>

        </div>


        <div class="hint">
            You can type Namaste to start registration
        </div>

    </div>


    <script>

        async function sendMessage() {

            const input = document.getElementById("message");

            const message = input.value.trim();

            if (!message) {
                return;
            }

            addMessage(message, "user");

            input.value = "";

            input.disabled = true;


            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });


                const data = await response.json();


                addMessage(
                    data.response || "Please try again.",
                    "bot"
                );


            } catch (error) {

                addMessage(
                    "Unable to connect to the assistant. Please try again.",
                    "bot"
                );

            }


            input.disabled = false;

            input.focus();

        }


        function addMessage(text, type) {

            const messages = document.getElementById("messages");


            const wrapper = document.createElement("div");

            wrapper.className =
                "message-wrapper " + type;


            const messageDiv =
                document.createElement("div");

            messageDiv.className = "message";

            messageDiv.textContent = text;


            const label =
                document.createElement("div");

            label.className = "message-label";

            label.textContent =
                type === "user"
                    ? "You"
                    : "AI Assistant";


            wrapper.appendChild(messageDiv);

            wrapper.appendChild(label);


            messages.appendChild(wrapper);


            messages.scrollTop =
                messages.scrollHeight;

        }


        function handleKey(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendMessage();

            }

        }

    </script>

</body>

</html>
