<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Registration Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chat-container {
            width: 450px;
            max-width: 95%;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h2 {
            margin: 0 0 6px;
        }

        .header p {
            margin: 0;
            font-size: 13px;
        }

        #messages {
            height: 450px;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            margin: 10px 0;
            padding: 12px 15px;
            border-radius: 14px;
            max-width: 80%;
            white-space: pre-wrap;
        }

        .bot {
            background: #f1f5f9;
            margin-right: auto;
        }

        .user {
            background: #4f46e5;
            color: white;
            margin-left: auto;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 8px;
        }

        #message {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
        }

        button {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }
    </style>
</head>


<body>

    <div class="chat-container">

        <div class="header">
            <h2>🤖 AI Registration Assistant</h2>
            <p>NLP-powered Internship Registration</p>
        </div>


        <div id="messages">

            <div class="message bot">
                Hello! 👋 Welcome to the AI Registration Assistant.
                Type "hello" to begin.
            </div>

        </div>


        <div class="input-area">

            <input id="message" type="text" placeholder="Type your message..." onkeydown="handleKey(event)">

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>


    <script>

        async function sendMessage() {

            const input = document.getElementById("message");

            const message = input.value.trim();

            if (!message) {
                return;
            }

            addMessage(message, "user");

            input.value = "";


            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });


                const data = await response.json();

                addMessage(data.response, "bot");

            }

            catch (error) {

                addMessage(
                    "Sorry, something went wrong.",
                    "bot"
                );

            }
        }


        function addMessage(text, type) {

            const messages = document.getElementById("messages");

            const messageDiv = document.createElement("div");

            messageDiv.className = "message " + type;

            messageDiv.textContent = text;

            messages.appendChild(messageDiv);

            messages.scrollTop = messages.scrollHeight;
        }


        function handleKey(event) {

            if (event.key === "Enter") {

                sendMessage();

            }
        }

    </script>

</body>

</html>
